name: Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/braidonw/golf-booker-rs:${{ github.sha }}
            ghcr.io/braidonw/golf-booker-rs:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summarise digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Pushed ghcr.io/braidonw/golf-booker-rs@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && vars.COOLIFY_APP_UUID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Coolify deploy
        shell: bash
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 --retry 3 \
            -X POST \
            -H "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\":\"$COOLIFY_APP_UUID\"}" \
            -o response.json \
            https://app.coolify.io/api/v1/deploy \
            && jq -e '.deployments[0].deployment_uuid' response.json \
            || { cat response.json; exit 1; }
